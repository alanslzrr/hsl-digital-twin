<title id="arquitectura-title">Del dato recibido a la consulta</title><desc id="arquitectura-desc">HSL y Open-Meteo alimentan Node-RED, que distribuye las medidas hacia el broker local, el mapa y el histórico consultado por Grafana.</desc>

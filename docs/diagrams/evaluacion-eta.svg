<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="evaluacion-eta-title evaluacion-eta-desc" id="evaluacion-eta-root">
<title id="evaluacion-eta-title">Una llegada evalúa todas sus predicciones</title><desc id="evaluacion-eta-desc">El servicio conserva las estimaciones y al recibir la llegada del mismo vehículo, viaje y parada calcula el error de cada predicción pendiente.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #evaluacion-eta-root { color: #243347; font-family: Arial,sans-serif; }
      #evaluacion-eta-root .diagram-container { width:100%;overflow-x:auto }
      #evaluacion-eta-root .diagram-container { overflow-x:visible }</style><marker id="evaluacion-eta-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#667489"/></marker><marker id="evaluacion-eta-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#667489" stroke-width="1.4"/></marker></defs>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="48" y="52" text-anchor="start" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#315f9b">Una llegada evalúa todas sus predicciones</text>

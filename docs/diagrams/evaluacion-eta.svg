2" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">PENDIENTES</text><rect x="896.0" y="580" width="96" height="16" fill="#ffffff"/><text x="944" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">ERRORES V2</text><rect x="48" y="104" width="224" height="64" rx="6" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.5"/><text x="160.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">Flota HSL</text><text x="160.0" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Posiciones y llegadas</text><rect x="368" y="104" width="224" height="64" rx="6" fill="#edf3fa" stroke="#315f9b" stroke-width="1.5"/><text x="480.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#315f9b">Servicio ETA</text><text x="480.0" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Estimar y emparejar</text><rect x="688" y="104" width="224" height="64" rx="6" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.5"/><text x="800.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">Pendientes</text><text x="800.0" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Cada predicción emitida</text><rect x="1008" y="104" width="224" height="64" rx="6" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.5"/><text x="1120.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">InfluxDB</text><text x="1120.0" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Errores por versión</text>
<line x1="48" y1="656" x2="1232" y2="656" stroke="#dce2e9"/>
<text x="48" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">El tiempo avanza hacia abajo. Coincidencia: vehículo + viaje + parada. Cada error conserva emisión, horizonte y versión.</text>
</svg>

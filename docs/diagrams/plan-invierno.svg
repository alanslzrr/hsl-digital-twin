<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="plan-invierno-title plan-invierno-desc" id="plan-invierno-root">
<title id="plan-invierno-title">Cómo se decide el plan de invierno</title><desc id="plan-invierno-desc">La regla comprueba primero la disponibilidad de datos y después la coincidencia entre nieve y empeoramiento del retraso.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #plan-invierno-root { color: #243347; font-family: Arial,sans-serif; }
      #plan-invierno-root .diagram-container { width:100%;overflow-x:auto }
      #plan-invierno-root .diagram-container { overflow-x:visible }</style><marker id="plan-invierno-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#667489"/></marker><marker id="plan-invierno-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#667489" stroke-width="1.4"/></marker></defs>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="48" y="52" text-anchor="start" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#315f9b">Cómo se decide el plan de invierno</text>
<path d="M640 168 V192" fill="none" stroke="#667489" stroke-width="1.6" marker-end="url(#plan-invierno-arrow)"/><path d="M832 256 H960" fill="none" stroke="#667489" stroke-width="1.6" marker-end="url(#plan-invierno-arrow)"/><path d="M640 320 V368" fill="none" stroke="#667489" stroke-width="1.6" marker-end="url(#plan-invierno-arrow)"/><path d="M832 440 H960" fill="none" stroke="#667489" stroke-width="1.6" marker-end="url(#plan-invierno-arrow)"/><path d="M640 512 V560" fill="none" stroke="#667489" stroke-width="1.6" marker-end="url(#plan-invierno-arrow)"/><rect x="876.0" y="228" width="32" height="16" fill="#ffffff"/><text x="892" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">NO</text><rect x="656.0" y="338" width="32" height="16" fill="#ffffff"/><text x="672" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">SÍ</text><rect x="876.0" y="412" width="32" height="16" fill="#ffffff"/><text x="892" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">SÍ</text><rect x="656.0" y="530" width="32" height="16" fill="#ffffff"/><text x="672" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">NO</text><rect x="448" y="104" width="384" height="64" rx="6" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.5"/><text x="640.0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">Contexto y dos ventanas</text><text x="640.0" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Últimos 10 min · intervalo de hace 70 a 60 min</text><polygon points="448.0,256 640,192.0 832.0,256 640,320.0" fill="#f6f8fb" stroke="#b9c3d0" stroke-width="1.5"/><text x="640" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">¿Hay datos suficientes</text><text x="640" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">y contexto vigente?</text><rect x="960" y="224" width="272" height="64" rx="6" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.5"/><text x="1096.0" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">Decisión inválida</text><text x="1096.0" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">No activar; indicar el motivo</text><polygon points="448.0,440 640,368.0 832.0,440 640,512.0" fill="#f6f8fb" stroke="#b9c3d0" stroke-width="1.5"/><text x="640" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">¿Hay nieve y empeora</text><text x="640" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">más de 90 segundos?</text><rect x="960" y="408" width="272" height="64" rx="6" fill="#edf3fa" stroke="#315f9b" stroke-width="1.5"/><text x="1096.0" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#315f9b">Activar el plan</text><text x="1096.0" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Decisión válida</text><rect x="448" y="560" width="384" height="64" rx="6" fill="#ffffff" stroke="#b9c3d0" stroke-width="1.5"/><text x="640.0" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#243347">No activar el plan</text><text x="640.0" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Decisión válida: las condiciones no coinciden</text>
<line x1="48" y1="656" x2="1232" y2="656" stroke="#dce2e9"/>
<text x="48" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#667489">Ciclo cada 5 minutos. Una decisión inválida se distingue de una decisión válida que no activa el plan.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1764b0"/></marker></defs><rect width="1280" height="480" fill="white"/><g font-family="Arial,sans-serif" fill="#162333"><text x="50" y="45" font-size="27" font-weight="700">El bucle actúa sobre la flota simulada, nunca sobre HSL</text><rect x="50" y="160" width="250" height="100" rx="10" fill="#f1f6fb" stroke="#b5c9dc"/><text x="70" y="200" font-size="21" font-weight="700">Flota real</text><text x="70" y="233" font-size="16">GPS fresco y dirección</text><path d="M300 210H345" fill="none" stroke="#1764b0" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="160" width="250" height="100" rx="10" fill="#f1f6fb" stroke="#b5c9dc"/><text x="370" y="200" font-size="21" font-weight="700">Gemelo cinemático</text><text x="370" y="233" font-size="16">Ruta y parámetros calibrados</text><path d="M600 210H645" fill="none" stroke="#1764b0" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="160" width="250" height="100" rx="10" fill="#f1f6fb" stroke="#b5c9dc"/><text x="670" y="200" font-size="21" font-weight="700">Mapa y medidas</text><text x="670" y="233" font-size="16">Irregularidad y residuos</text><path d="M900 210H945" fill="none" stroke="#1764b0" stroke-width="2" marker-end="url(#arrow)"/><rect x="950" y="160" width="250" height="100" rx="10" fill="#f1f6fb" stroke="#b5c9dc"/><text x="970" y="200" font-size="21" font-weight="700">Regla de retención</text><text x="970" y="233" font-size="16">Actuar solo con CV ≤ 0,3</text><path d="M1075 260V345H475V263" fill="none" stroke="#1764b0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="650" y="329" font-size="17">Orden de espera en la próxima parada</text><text x="50" y="410" font-size="18">Escenarios controlados cambian velocidad, paradas, cortes y refuerzos.</text><text x="50" y="440" font-size="16" fill="#617083">Los ensayos sin sincronización permiten observar el efecto de la decisión sin copiar la realidad.</text></g></svg>